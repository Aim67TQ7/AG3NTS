<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operis Studio</title><style>
:root{--bg:#10151d;--panel:#18202b;--border:#2c3847;--text:#e8edf4;--muted:#a2b0c2;--accent:#71e0c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:7px;background:#263449;color:var(--text);padding:9px 13px}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#10251f;font-weight:650}input,select,textarea{border:1px solid var(--border);border-radius:6px;background:#111a25;color:var(--text);padding:10px;width:100%}textarea{min-height:110px;resize:vertical;font:12px ui-monospace,monospace;line-height:1.6}h1{font-size:28px;margin:0 0 8px}h2{font-size:18px}h3{font-size:15px}p{color:var(--muted);line-height:1.6}.layout{display:grid;grid-template-columns:215px 1fr;min-height:100vh}aside{border-right:1px solid var(--border);padding:27px 18px;background:#121a24}nav{display:grid;gap:8px;margin-top:30px}nav button{text-align:left;background:transparent;border:0;color:var(--muted)}nav button.active{background:#253848;color:var(--accent)}.brand{font-size:22px;letter-spacing:3px;font-weight:800}.sub{font-size:11px;letter-spacing:2px;color:var(--muted);margin-top:9px}main{padding:30px 38px;max-width:1600px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}.badge{display:inline-block;font-size:11px;border:1px solid var(--border);border-radius:20px;padding:5px 9px;color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:22px;margin-bottom:16px}.metric{font-size:32px;font-weight:650;margin:8px 0}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:12px}.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;line-height:1.6;background:#111923;padding:15px;border-radius:7px;max-height:400px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;border-bottom:1px solid var(--border);padding:12px 8px}th{color:var(--muted)}.colorbar{height:4px;margin:-22px -22px 18px;border-radius:11px 11px 0 0}.hidden{display:none!important}.notice{padding:12px;border:1px solid #456253;border-radius:6px;color:#b5dfce;font-size:12px;margin-bottom:20px}.error{border-color:#a75252;color:#ffc1c1}#toast{position:fixed;bottom:22px;right:24px;max-width:650px;z-index:20;background:#29463c;padding:16px;border-radius:8px;box-shadow:0 8px 40px #0009}dialog{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;width:min(850px,94vw);max-height:90vh}dialog::backdrop{background:#0009}.canvas{min-height:330px;position:relative;overflow:auto;background-image:radial-gradient(#354356 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--border);border-radius:10px}.node{position:absolute;width:190px;padding:15px;border:1px solid #52728e;border-radius:9px;background:#202e40;cursor:grab;z-index:2}.node small{display:block;color:var(--muted);margin-top:7px}svg{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}.builder{display:grid;grid-template-columns:1fr 350px;gap:20px}.pill{color:var(--muted);font-size:11px}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:1000px){.builder,.split{grid-template-columns:1fr}main{padding:20px}.layout{grid-template-columns:160px 1fr}}@media(max-width:650px){.layout{display:block}aside{padding:15px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}.top{align-items:flex-start}.brand{font-size:19px}}
</style></head><body><div class="layout"><aside><div class="brand">Operis<span style="color:var(--accent)">/</span></div><div class="sub">AGENT STUDIO</div><nav id="nav"></nav><div class="sub" style="margin-top:45px">PRIVATE OPERATOR ACCESS</div><p style="font-size:12px">Durable records.<br>Bounded capabilities.<br>Visible evidence.</p></aside><main><div class="top"><div><h1 id="title">Overview</h1><div class="muted" id="subtitle">Build with contracts. Operate with evidence.</div></div><div class="row"><span class="badge">Operis · PZLO</span><button id="refresh">Refresh</button></div></div><div id="status" class="notice">Connecting to Operis…</div><section id="view"></section></main></div><div id="toast" class="hidden" role="status"></div><dialog id="detail"><div class="row between"><h2 id="detailTitle"></h2><button onclick="document.querySelector('#detail').close()">Close</button></div><pre id="detailText"></pre></dialog>
<script>
let state={agents:[],resources:[],workflows:[],runs:[],audit:[]},live=null,page='Overview',selected=null,wf={id:'my-workflow',version:'1.0.0',name:'My workflow',nodes:[],edges:[]};
const colors={DOC:'#64748B',READ:'#0284C7',MAP:'#0891B2',RULE:'#7C3AED',CLASS:'#0D9488',ROUTE:'#D97706',COMMS:'#DB2777',WRITE:'#DC2626',REASON:'#6D28D9'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const json=x=>JSON.stringify(x,null,2);const $=s=>document.querySelector(s);let busy=false;
async function api(path,body){let r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
function toast(s,bad=false){$('#toast').textContent=s;$('#toast').style.background=bad?'#6b3434':'#29463c';$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),6500)}
async function action(fn){if(busy)return;busy=true;try{await fn()}catch(e){toast(e.message,true)}finally{busy=false}}
function detail(title,data){$('#detailTitle').textContent=title;$('#detailText').textContent=json(data);$('#detail').showModal()}
async function load(){state=await api('state');$('#status').textContent='Connected to verified Operis · Definitions and results persist in private Storage · Existing agents remain unchanged';render()}
function btn(name,fn,cls=''){let b=document.createElement('button');b.textContent=name;b.className=cls;b.onclick=()=>action(fn);return b}
function table(rows,cols){return rows.length?'<table><thead><tr>'+cols.map(x=>'<th>'+esc(x[0])+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(x=>'<td>'+esc(x[1](r))+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<div class="empty">No records yet.</div>'}
const pages=['Overview','Agent Library','Build Agent','Workflows','Resources','Operis Monitor','Execution History','Human Review','Audit & Cost'];$('#nav').innerHTML=pages.map(p=>'<button data-page="'+p+'">'+p+'</button>').join('');$('#nav').onclick=e=>{if(e.target.dataset.page){page=e.target.dataset.page;render()}};$('#refresh').onclick=()=>action(async()=>{await load();if(page==='Operis Monitor')await monitor()});
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#title').textContent=page;$('#view').innerHTML='';if(page==='Overview')overview();if(page==='Agent Library')library();if(page==='Build Agent')builder();if(page==='Workflows')workflows();if(page==='Resources')resources();if(page==='Operis Monitor')monitor().catch(e=>toast(e.message,true));if(page==='Execution History')history();if(page==='Human Review')reviews();if(page==='Audit & Cost')audit()}
function overview(){let verified=state.runs.filter(x=>x.result_status==='VERIFIED').length;$('#view').innerHTML='<div class="grid">'+[['Registered versions',state.agents.length],['Published versions',state.agents.filter(a=>a.status==='published').length],['Verified executions',verified],['Review required',state.runs.filter(r=>r.result_status==='REVIEW_REQUIRED').length]].map(([s,n])=>'<div class="card"><span class="muted">'+s+'</span><div class="metric">'+n+'</div><span class="pill">Studio durable records</span></div>').join('')+'</div><div class="split"><div class="card"><h2>Create a bounded capability</h2><p>Define its responsibility, contracts and six execution functions. Test it, publish an immutable version, then execute or export its six-file package.</p><div id="quick"></div></div><div class="card"><h2>Watch the existing pipeline</h2><p>Agent 01 capture → Agent 02 document reading → Agent 03 classification → Agent 04 shadow routing. Live health and Operis execution evidence are shown separately.</p><div id="watch"></div></div></div><div class="card"><h2>Recent execution evidence</h2>'+table(state.runs.slice(0,6),[['Agent',r=>r.agent_ref],['Result',r=>r.result_status],['Completed',r=>r.completed_at],['Time',r=>r.duration_ms+' ms']])+'</div>';$('#quick').append(btn('Build agent',()=>{selected=null;page='Build Agent';render()},'primary'));$('#watch').append(btn('Open monitor',()=>{page='Operis Monitor';render()}))}
function library(){$('#view').innerHTML='<div class="notice">Existing production agents appear in Operis Monitor. Studio builds new draft identities without renaming them. Executable authoring currently supports deterministic MAP and RULE with P0 authority.</div><h2>Existing deployed capabilities</h2><div class="grid" id="existing-cards"><p>Loading observed identities…</p></div><h2>Studio definitions</h2><div class="grid" id="cards"></div>';for(let a of state.agents){let card=document.createElement('div');card.className='card';card.innerHTML='<div class="colorbar" style="background:'+colors[a.capability]+'"></div><div class="row between"><strong>'+esc(a.name)+'</strong><span class="badge">'+a.status+'</span></div><p>'+esc(a.responsibility)+'</p><p class="pill">'+esc(a.id)+' @ '+esc(a.version)+' · '+a.capability+' · P0 · Model OFF</p><div class="row"></div>';let row=card.querySelector('.row:last-child'),ref=a.id+'@'+a.version;row.append(btn('Inspect',()=>detail(a.name,a)),btn('Edit new version',()=>{selected=structuredClone(a);let v=a.version.split('.').map(Number);v[2]++;selected.version=v.join('.');page='Build Agent';render()}),btn('Test',async()=>{detail('Acceptance tests',await api('agents/test',{agent_ref:ref}));await load()}),btn('Publish',async()=>{await api('agents/publish',{agent_ref:ref});toast('Published immutable version');await load()}));let anchor=document.createElement('a');anchor.href='/api/export/'+encodeURIComponent(ref);anchor.textContent='Export package';anchor.style.color='var(--accent)';row.append(anchor);if(a.status==='published')row.append(btn('Execute',()=>executionForm(a)));$('#cards').append(card)}if(!state.agents.length)$('#cards').innerHTML='<div class="card"><h2>No Studio definitions yet</h2><p>Build a deterministic capability to start.</p></div>';existingCards().catch(e=>toast(e.message,true))}
async function existingCards(){let data=await api('live');if(page!=='Agent Library')return;$('#existing-cards').innerHTML='';for(let a of data.agents){let cap=['','READ','DOC','CLASS','ROUTE'][a.number],el=document.createElement('div');el.className='card';el.innerHTML='<div class="colorbar" style="background:'+colors[cap]+'"></div><strong>'+esc(a.health.agent||'Agent 0'+a.number)+'</strong><p>'+cap+' · Observed '+esc(a.health.status)+'</p><p class="pill">Existing implementation · Monitoring only</p><div class="row"></div>';el.querySelector('.row').append(btn('Health & identity',()=>detail('Existing deployed agent',a.health)),btn('History',()=>detail('Durable execution records',a.runs)));$('#existing-cards').append(el)}}
function sample(kind='map'){let inp={type:'object',properties:{supplier:{type:'string'}},required:['supplier'],additionalProperties:false},out={type:'object',properties:{supplier_name:{type:'string'}},required:['supplier_name'],additionalProperties:false};return{id:'supplier-name-mapper',name:'Supplier name mapper',version:'0.1.0',responsibility:'Rename the supplied supplier field to supplier_name.',capability:'MAP',authority:'P0',model_access:false,input_schema:inp,output_schema:out,instructions:'Map only the supplied supplier name. Never retrieve or change external records.',functions:{trigger:'Explicit approved invocation',input:'Validate supplied JSON against the input contract',execute:'Apply declared field mapping only',output:'Commit schema-valid result to Operis',error:'Commit explicit failure; do not invent missing fields',verify:'Validate output and retain input/output hashes'},execution:{kind:'map',fields:{supplier_name:'supplier'}},tests:[{input:{supplier:'Synthetic supplier'},expected:{supplier_name:'Synthetic supplier'}},{input:{},expect_error:true}]}}
function builder(){let a=selected||sample();$('#view').innerHTML='<div class="notice">This creates a real, executable deterministic definition. P0 supplied-data processing only. No implicit business policy, model access or connector authority.</div><div class="split"><div class="card"><h2>Identity & responsibility</h2>'+['id','name','version','responsibility'].map(k=>'<label>'+k+'</label><input id="a-'+k+'" value="'+esc(a[k])+'">').join('')+'<label>Capability / registered interpreter</label><select id="a-kind"><option value="map">MAP · Field mapping</option><option value="rule">RULE · Explicit comparison</option></select><label>Instructions</label><textarea id="a-instructions">'+esc(a.instructions)+'</textarea><label>Six execution functions</label><textarea id="a-functions">'+esc(json(a.functions))+'</textarea><label>Registered resource pins (optional)</label><select id="resource-pin"><option value="">No additional resource</option>'+state.resources.map((r,i)=>'<option value="'+i+'">'+esc(r.kind+' / '+r.id+' @ '+r.version)+'</option>').join('')+'</select><p class="pill">Selecting a schema fills the input contract; an instruction resource fills the procedure. A rule resource fills the explicit rule interpreter. The saved version includes the immutable resource hash.</p></div><div class="card"><h2>Contracts & acceptance</h2><label>Input JSON Schema</label><textarea id="a-input">'+esc(json(a.input_schema))+'</textarea><label>Output JSON Schema</label><textarea id="a-output">'+esc(json(a.output_schema))+'</textarea><label>Interpreter configuration</label><textarea id="a-execution">'+esc(json(a.execution))+'</textarea><label>Acceptance fixtures</label><textarea id="a-tests">'+esc(json(a.tests))+'</textarea><div class="row" style="margin-top:18px" id="save-agent"></div></div></div>';$('#a-kind').value=a.execution.kind;$('#a-kind').onchange=()=>{if($('#a-kind').value==='rule'){$('#a-execution').value=json({kind:'rule',field:'supplier',operator:'eq',value:'Synthetic supplier',on_false:'review'});$('#a-output').value=json({type:'object',properties:{matched:{type:'boolean'}},required:['matched'],additionalProperties:false});$('#a-tests').value=json([{input:{supplier:'Synthetic supplier'},expected:{matched:true}},{input:{supplier:'Other'},expected:{matched:false}}]);$('#a-id').value='supplier-rule';$('#a-name').value='Supplier rule';$('#a-responsibility').value='Compare the supplied supplier against the explicitly configured value.'}};$('#resource-pin').onchange=()=>{let r=state.resources[Number($('#resource-pin').value)];if($('#resource-pin').value==='')return;if(r.kind==='schema')$('#a-input').value=json(r.content);if(r.kind==='instructions')$('#a-instructions').value=typeof r.content==='string'?r.content:json(r.content);if(r.kind==='rules'){$('#a-kind').value='rule';$('#a-execution').value=json(r.content)}};$('#save-agent').append(btn('Save immutable agent version',async()=>{let b={...a};for(let k of ['id','name','version','responsibility','instructions'])b[k]=$('#a-'+k).value;for(let [k,id] of [['input_schema','input'],['output_schema','output'],['functions','functions'],['execution','execution'],['tests','tests']])b[k]=JSON.parse($('#a-'+id).value);b.capability=$('#a-kind').value==='map'?'MAP':'RULE';let pin=$('#resource-pin').value;b.resource_refs=pin===''?[]:[{kind:state.resources[pin].kind,id:state.resources[pin].id,version:state.resources[pin].version,content_hash:state.resources[pin].content_hash}];await api('agents',b);selected=null;page='Agent Library';toast('Agent version committed to Operis');await load()},'primary'))}
function executionForm(a){$('#detailTitle').textContent='Execute '+a.name;$('#detailText').innerHTML='';$('#detailText').append(document.createTextNode('Supplied input JSON. Each execution is durably audited.\n'));let t=document.createElement('textarea');t.value=json(a.tests[0].input);$('#detailText').append(t);$('#detailText').append(btn('Run capability',async()=>{let r=await api('execute',{agent_ref:a.id+'@'+a.version,input:JSON.parse(t.value),idempotency_key:crypto.randomUUID()});detail('Execution evidence',r);await load()},'primary'));$('#detail').showModal()}
function resources(){$('#view').innerHTML='<div class="split"><div class="card"><h2>Versioned resources</h2>'+table(state.resources,[['Kind',r=>r.kind],['Identity',r=>r.id],['Version',r=>r.version]])+'</div><div class="card"><h2>Register a resource</h2><label>Type</label><select id="r-kind"><option>schema</option><option>instructions</option><option>rules</option></select><label>Draft ID</label><input id="r-id" placeholder="supplier-input"><label>Version</label><input id="r-version" value="0.1.0"><label>Content (JSON Schema / JSON string instructions / rule configuration)</label><textarea id="r-content">'+esc(json(sample().input_schema))+'</textarea><div id="r-save"></div></div></div>';$('#r-save').append(btn('Register immutable version',async()=>{await api('resources',{kind:$('#r-kind').value,id:$('#r-id').value,version:$('#r-version').value,content:JSON.parse($('#r-content').value)});toast('Registered in Operis');await load()},'primary'))}
function workflows(){let published=state.agents.filter(a=>a.status==='published');$('#view').innerHTML='<div class="notice">Executable MVP workflows connect published P0 capabilities in a linear chain. Each stage consumes committed Operis records. Existing production routing remains in shadow mode.</div><div class="builder"><div><div class="card"><div class="row"><input id="w-id" value="'+esc(wf.id)+'" aria-label="Workflow ID"><input id="w-version" value="'+esc(wf.version)+'" aria-label="Version"></div><label>Name</label><input id="w-name" value="'+esc(wf.name)+'"><div class="row" style="margin-top:15px"><select id="w-agent" style="flex:1">'+published.map(a=>'<option>'+esc(a.id+'@'+a.version)+'</option>').join('')+'</select><button id="add-node">Add capability</button></div></div><div class="canvas" id="canvas"><svg id="lines"></svg></div><div class="card"><h3>Connect durable output → input</h3><div class="row"><select id="edge-source" style="flex:1"></select><span>→</span><select id="edge-target" style="flex:1"></select><button id="add-edge">Connect</button></div><div id="edge-list"></div></div><div class="row" id="w-actions"></div><pre id="w-report">Select published capabilities, connect their contracts, then validate.</pre></div><div><div class="card"><h2>Saved workflow versions</h2><div id="saved-workflows"></div></div><div class="card"><h2>Run supplied input</h2><p>The saved, published definition executes. A durable idempotency key supports safe resume after interruption.</p><label>Input JSON</label><textarea id="w-input">'+esc(json(sample().tests[0].input))+'</textarea><label>Execution / resume key</label><input id="w-key" value="'+crypto.randomUUID()+'"><div class="row" style="margin-top:15px" id="run-workflow"></div></div></div></div>';
$('#add-node').onclick=()=>{let ref=$('#w-agent').value;if(!ref)return toast('Publish a capability first',true);wf.nodes.push({id:'step-'+(wf.nodes.length+1),agent_ref:ref,x:35+wf.nodes.length*210,y:70});draw()};$('#add-edge').onclick=()=>{let s=$('#edge-source').value,t=$('#edge-target').value;if(!s||!t||s===t)return toast('Choose distinct nodes',true);if(!wf.edges.some(e=>e.source===s&&e.target===t))wf.edges.push({source:s,target:t});draw()};
function capture(){wf.id=$('#w-id').value;wf.version=$('#w-version').value;wf.name=$('#w-name').value;return structuredClone(wf)}
$('#w-actions').append(btn('Validate',async()=>{$('#w-report').textContent=json(await api('workflows/validate',capture()))}),btn('Save version',async()=>{let r=await api('workflows',capture());$('#w-report').textContent=json(r);toast('Workflow committed');await load()},'primary'),btn('Publish saved version',async()=>{$('#w-report').textContent=json(await api('workflows/publish',{id:$('#w-id').value,version:$('#w-version').value}));toast('Published saved definition');await load()}));
for(let w of state.workflows){let el=document.createElement('div');el.className='stack';el.style.marginBottom='20px';el.innerHTML='<strong>'+esc(w.name)+'</strong><span class="pill">'+esc(w.id+' @ '+w.version)+'</span>';el.append(btn('Load canvas',()=>{wf=structuredClone(w);render()}));$('#saved-workflows').append(el)}
$('#run-workflow').append(btn('Run / resume',async()=>{let r=await api('workflows/run',{id:$('#w-id').value,version:$('#w-version').value,input:JSON.parse($('#w-input').value),idempotency_key:$('#w-key').value});detail('Durable workflow results',r);await load()},'primary'),btn('Pause',async()=>{await api('workflows/control',{workflow_ref:$('#w-id').value+'@'+$('#w-version').value,action:'pause'});toast('New manual runs paused');await load()}),btn('Resume',async()=>{await api('workflows/control',{workflow_ref:$('#w-id').value+'@'+$('#w-version').value,action:'resume'});toast('Manual runs enabled');await load()}));draw()}
function draw(){let c=$('#canvas');if(!c)return;c.querySelectorAll('.node').forEach(n=>n.remove());let max=500;for(let n of wf.nodes){max=Math.max(max,(n.x||0)+220);let el=document.createElement('div');el.className='node';el.style.left=(n.x||30)+'px';el.style.top=(n.y||70)+'px';el.innerHTML='<strong>'+esc(n.id)+'</strong><small>'+esc(n.agent_ref)+'</small><button style="padding:3px 7px;margin-top:9px">Remove</button>';el.querySelector('button').onclick=()=>{wf.nodes=wf.nodes.filter(x=>x!==n);wf.edges=wf.edges.filter(e=>e.source!==n.id&&e.target!==n.id);draw()};el.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;let x=e.clientX,y=e.clientY,ox=n.x||30,oy=n.y||70;el.setPointerCapture(e.pointerId);el.onpointermove=ev=>{n.x=Math.max(0,ox+ev.clientX-x);n.y=Math.max(0,oy+ev.clientY-y);el.style.left=n.x+'px';el.style.top=n.y+'px';lines()};el.onpointerup=()=>{el.onpointermove=null;draw()}};c.append(el)}c.style.minWidth=Math.min(max,1500)+'px';for(let id of ['edge-source','edge-target'])$('#'+id).innerHTML=wf.nodes.map(n=>'<option>'+esc(n.id)+'</option>').join('');$('#edge-list').innerHTML=wf.edges.map((e,i)=>'<p>'+esc(e.source)+' → '+esc(e.target)+' <button data-remove="'+i+'">Remove</button></p>').join('');$('#edge-list').onclick=e=>{if(e.target.dataset.remove!==undefined){wf.edges.splice(Number(e.target.dataset.remove),1);draw()}};lines()}
function lines(){let s=$('#lines');if(!s)return;s.innerHTML='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#71e0c4"/></marker></defs>'+wf.edges.map(e=>{let a=wf.nodes.find(n=>n.id===e.source),b=wf.nodes.find(n=>n.id===e.target);if(!a||!b)return '';return '<path d="M'+((a.x||30)+190)+' '+((a.y||70)+40)+' L'+(b.x||30)+' '+((b.y||70)+40)+'" stroke="#71e0c4" stroke-width="2" marker-end="url(#arrow)"/>'}).join('')}
async function monitor(){$('#view').innerHTML='<p>Loading observed health and durable execution records…</p>';live=await api('live');if(page!=='Operis Monitor')return;$('#view').innerHTML='<div class="notice">'+esc(live.scope)+' Observed '+esc(live.observed_at)+'. Health is separate from completed execution evidence.</div><div class="grid" id="live-cards"></div><div class="card"><h2>Bounded handoff evidence</h2><p>Recent records by stage; record IDs identify durable handoffs. These independently bounded samples are not a completeness claim.</p><div id="lineage"><button id="load-lineage">Load Operis records</button></div></div>';for(let a of live.agents){let d=document.createElement('div');d.className='card';d.innerHTML='<div class="colorbar" style="background:'+colors[['','READ','DOC','CLASS','ROUTE'][a.number]]+'"></div><h2>Agent 0'+a.number+' · '+['','Email Capture','Document Reader','Classifier','Workflow Router'][a.number]+'</h2><span class="badge">'+esc(a.health.status||'unknown')+'</span><p>'+esc(a.health.agent||'Health identity unavailable')+'</p><p>Observed history: '+a.runs.length+' recent records</p>'+(a.history_error?'<p class="error">'+esc(a.history_error)+'</p>':'')+'<div class="row"></div>';d.querySelector('.row').append(btn('Health detail',()=>detail('Observed endpoint',a.health)),btn('Execution evidence',()=>detail(a.table,a.runs)));$('#live-cards').append(d)}$('#load-lineage').onclick=()=>action(async()=>{let d=await api('lineage');$('#lineage').innerHTML=Object.entries(d).map(([k,v])=>'<h3>'+esc(k)+'</h3>'+(v.error?'<p>'+esc(v.error)+'</p>':'<pre>'+esc(json(v.rows))+'</pre>')).join('')})}
function history(){$('#view').innerHTML='<div class="card"><h2>Immutable capability results</h2>'+table(state.runs,[['Agent',r=>r.agent_ref],['Result',r=>r.result_status],['Record',r=>r.record_id],['Time',r=>r.duration_ms+' ms'],['Tokens',r=>r.input_tokens+r.output_tokens],['Model cost',r=>'$'+r.model_cost_usd]])+'<div id="run-details" class="row" style="margin-top:15px"></div></div>';for(let r of state.runs.slice(0,30))$('#run-details').append(btn(r.agent_ref+' · '+r.record_id.slice(0,8),()=>detail('Result, lineage and audit',r)))}
function reviews(){let rows=state.runs.filter(r=>r.result_status==='REVIEW_REQUIRED');$('#view').innerHTML='<div class="notice">Decisions apply only to the exact immutable result and internal P0 workflow continuation. They never authorize ERP writes or messages. Resume the original workflow key after approval.</div><div class="grid" id="review-cards"></div>';for(let r of rows){let d=document.createElement('div');d.className='card';let decisions=state.audit.filter(a=>a.action==='review.decided'&&a.payload.record_id===r.record_id);d.innerHTML='<h2>'+esc(r.agent_ref)+'</h2><p>'+esc(r.record_id)+'</p><span class="badge">'+esc(decisions[0]?.payload.decision||'Waiting for review')+'</span><pre>'+esc(json({input:r.input,output:r.output,evidence:r.evidence}))+'</pre><label>Decision reason</label><input placeholder="Evidence and reason"><div class="row" style="margin-top:12px"></div>';for(let choice of ['approve','reject','escalate'])d.querySelector('.row').append(btn(choice,async()=>{await api('review',{record_id:r.record_id,decision:choice,reason:d.querySelector('input').value});toast('Decision committed to Operis');await load()}));$('#review-cards').append(d)}if(!rows.length)$('#review-cards').innerHTML='<div class="card"><h2>No Studio reviews waiting</h2><p>RULE definitions can explicitly specify on_false: review. Existing production review flags are visible in the Operis Monitor and remain under their current owner.</p></div>'}
function audit(){let total=state.runs.reduce((s,r)=>s+r.model_cost_usd,0);$('#view').innerHTML='<div class="grid"><div class="card"><h2>Studio model cost</h2><div class="metric">$'+total.toFixed(2)+'</div><p>Deterministic interpreter · model OFF</p></div><div class="card"><h2>Infrastructure cost</h2><div class="metric">Unknown</div><p>No measured infrastructure billing source</p></div></div><div class="card"><h2>Configuration & control audit</h2>'+table(state.audit,[['Action',r=>r.action],['Actor',r=>r.actor],['Time',r=>r.created_at],['Hash',r=>r.content_hash.slice(0,14)]])+'<div id="audit-details" class="row" style="margin-top:15px"></div></div><p>Creation audit is embedded in immutable definitions. Execution audit is committed atomically with each immutable result. Production agents retain their own measured telemetry.</p>';for(let r of state.audit.slice(0,20))$('#audit-details').append(btn(r.action,()=>detail('Audit record',r)))}
load().catch(e=>{$('#status').textContent=e.message;$('#status').classList.add('error')});setInterval(()=>{if(page==='Operis Monitor'&&!busy)monitor().catch(()=>{})},30000);
</script></body></html>
